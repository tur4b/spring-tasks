services:
  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: simpleDB
      POSTGRES_USER: postgresql
      POSTGRES_PASSWORD: postgresql
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/data/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./src/main/resources/data/02_data.sql:/docker-entrypoint-initdb.d/02_data.sql

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

volumes:
  postgres_data:
  prometheus_data:

