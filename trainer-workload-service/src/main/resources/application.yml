spring:
  application:
    name: trainer-workload-service
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://admin:admin123@localhost:27017/trainers_db?authSource=admin}
      database: ${SPRING_DATA_MONGODB_DATABASE:trainers_db}
  jackson:
    serialization:
      write-dates-as-timestamps: false
  activemq:
    broker-url: ${SPRING_ACTIVEMQ_BROKER_URL:tcp://localhost:61616}
    user: ${SPRING_ACTIVEMQ_USER:admin}
    password: ${SPRING_ACTIVEMQ_PASSWORD:admin}

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

security:
  jwt:
    secret: ${SECURITY_JWT_SECRET:ZmFpZV9qd3Rfc2VjcmV0X2tleV9mb3IvcHJvZA==}
    expiration-ms: 3600000

workload:
  messaging:
    enabled: true

logging:
  level:
    root: INFO
    org.example: DEBUG
    org.springframework.data.mongodb: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [transactionId=%X{transactionId}] - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [transactionId=%X{transactionId}] - %msg%n"
  file:
    name: app.log

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
  endpoint:
    health:
      show-details: always