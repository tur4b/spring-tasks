# Production Environment Profile
# Server
server.port=8080
server.compression.enabled=true
server.compression.min-response-size=1024

# Database - Production PostgreSQL server (replicate for HA)
spring.datasource.url=jdbc:postgresql://db.product:5432/simpleDB
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Actuator - restricted for security
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoints.web.base-path=/actuator

logging.level.root=WARN
logging.level.org.example=WARN
logging.level.org.springframework.web=WARN

# Connection Pool - optimized for production
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Prometheus - enabled for monitoring
management.prometheus.metrics.export.enabled=true
management.metrics.tags.environment=production

# Performance
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

