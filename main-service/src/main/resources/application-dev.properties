# Development Environment Profile
# Use: --spring.profiles.active=dev

# Server
server.port=8080

# Database - Dev PostgreSQL server
spring.datasource.url=jdbc:postgresql://localhost:5432/simpleDB
spring.datasource.username=${DB_USERNAME:postgresql}
spring.datasource.password=${DB_PASSWORD:postgresql}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Actuator - expose metrics and health for monitoring
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized

# Logging - standard level
logging.level.root=INFO
logging.level.org.example=INFO
logging.level.org.springframework.web=INFO

# Connection Pool
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=2

# Prometheus
management.prometheus.metrics.export.enabled=true
management.metrics.tags.environment=dev

