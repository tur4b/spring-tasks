# Spring Boot Application Name
spring.application.name=main-service

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Jackson Configuration
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20

spring.sql.init.mode=never
#spring.sql.init.schema-locations=classpath:data/01_schema.sql
#spring.sql.init.data-locations=classpath:data/02_data.sql

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true

# Prometheus Metrics
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}

# Logging (default)
logging.level.root=INFO
logging.level.org.example=INFO
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Connection Pool (HikariCP defaults via Spring Boot)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Profiles (dev, prod)
spring.profiles.active=dev

# JWT security configuration
security.jwt.secret=ZmFrZV9qd3Rfc2VjcmV0X2tleV9mb3IvcHJvZA==
security.jwt.expiration-ms=3600000

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ActiveMQ
spring.activemq.broker-url=tcp://localhost:61616
spring.activemq.user=admin
spring.activemq.password=admin
workload.messaging.enabled=true
